name: Keep Render App Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          echo "Pinging app health endpoint..."
          curl -f https://sprintsync-hldr.onrender.com/health || exit 1
