services:
  - type: web
    name: sprintsync-backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sprintsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sprintsync-db
    plan: free
    databaseName: sprintsync
    user: sprintsync